<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio</title>
  <style>
    :root{
      --bg: #ffffff;
      --nav-bg: rgba(255,255,255,0.9);
      --accent: #7c3aed; /* subtle purple accent */
      --text: #0f172a;
      --muted: #475569;
      --glass: rgba(255,255,255,0.6);
      --shadow: 0 6px 18px rgba(15,23,42,0.08);
      --radius: 12px;
      --gap: 20px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; color:var(--text); background:var(--bg)}

    /* NAV BAR */
    .nav-wrap{position:sticky;top:0;z-index:40;background:linear-gradient(180deg, var(--nav-bg), rgba(255,255,255,0.85));backdrop-filter: blur(6px);box-shadow:var(--shadow)}
    nav.container{
      max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:var(--gap)
    }

    /* Left area */
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#a78bfa,#60a5fa);display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
    .site-title{font-weight:600}

    /* Links */
    .nav-links{display:flex;align-items:center;gap:8px}
    .nav-links ul{list-style:none;margin:0;padding:0;display:flex;gap:6px;align-items:center}
    .nav-links a, .nav-links button{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer}
    .nav-links a:hover, .nav-links button:hover{color:var(--text);background:rgba(15,23,42,0.03)}

    /* Projects dropdown */
    .dropdown{position:relative}
    .dropdown-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:180px;background:white;border-radius:10px;box-shadow:0 8px 40px rgba(2,6,23,0.08);padding:8px;display:none;flex-direction:column;gap:6px}
    .dropdown-menu a{padding:10px;border-radius:8px;color:var(--muted);text-decoration:none}
    .dropdown-menu a:hover{background:rgba(15,23,42,0.03);color:var(--text)}
    .dropdown.open .dropdown-menu{display:flex}

    /* Right area */
    .right-actions{display:flex;gap:10px;align-items:center}

    /* Mobile hamburger */
    .hamburger{display:none;background:transparent;border:0;padding:10px;border-radius:8px}

    /* Responsive */
    @media (max-width:860px){
      .nav-links{display:none}
      .hamburger{display:inline-flex}
      .mobile-menu{display:none;position:absolute;left:0;right:0;top:64px;background:linear-gradient(180deg,white, #fbfdff);box-shadow:0 8px 30px rgba(2,6,23,0.08);padding:14px;border-top:1px solid rgba(15,23,42,0.04)}
      .mobile-menu.open{display:block}
      .mobile-menu ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
      .mobile-menu a, .mobile-menu button{padding:10px;border-radius:8px;text-align:left}
    }

    /* small demo body */
    main{padding:40px 20px;max-width:1100px;margin:0 auto}
    .hero{height:420px;border-radius:12px;background:linear-gradient(180deg,#f8fafc,#ffffff);display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px dashed rgba(15,23,42,0.04)}

  </style>
</head>
<body>
  <header class="nav-wrap">
    <nav class="container" role="navigation" aria-label="Main navigation">
      <div class="brand">
        <div class="logo" aria-hidden="true">YI</div>
        <div>
          <div class="site-title">My Portfolio</div>
          <div style="font-size:12px;color:var(--muted)">A blank navigation template</div>
        </div>
      </div>

      <div class="nav-links" id="desktopNav">
        <ul>
          <li><a href="#">Home</a></li>

          <li class="dropdown" id="projectsDropdown">
            <button aria-haspopup="true" aria-expanded="false" id="projectsBtn">Projects ▾</button>
            <div class="dropdown-menu" role="menu" aria-label="Projects submenu">
              <a href="#" role="menuitem">Unit 1</a>
              <a href="#" role="menuitem">Unit 2</a>
              <a href="#" role="menuitem">Unit 3</a>
              <a href="#" role="menuitem">Unit 4</a>
            </div>
          </li>

          <li><a href="#">Resources</a></li>
          <li><a href="#">About me</a></li>
          <li><a href="#">Gaming Hub</a></li>
        </ul>
      </div>

      <div class="right-actions">
        <button class="hamburger" id="hamburger" aria-label="Open menu">☰</button>
      </div>
    </nav>

    <!-- Mobile menu (hidden on wide screens) -->
    <div class="mobile-menu" id="mobileMenu">
      <ul>
        <li><a href="#">Home</a></li>
        <li>
          <button class="mobile-projects-btn" aria-expanded="false">Projects ▾</button>
          <div class="mobile-submenu" style="display:none;padding-left:8px;margin-top:6px">
            <a href="#">Unit 1</a>
            <a href="#">Unit 2</a>
            <a href="#">Unit 3</a>
            <a href="#">Unit 4</a>
          </div>
        </li>
        <li><a href="#">Resources</a></li>
        <li><a href="#">About me</a></li>
        <li><a href="#">Gaming Hub</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero">Place your page content here — nav is a blank template.</section>
  </main>

  <script>
    // Desktop dropdown
    const projectsBtn = document.getElementById('projectsBtn');
    const projectsDropdown = document.getElementById('projectsDropdown');
    projectsBtn.addEventListener('click', (e)=>{
      const open = projectsDropdown.classList.toggle('open');
      projectsBtn.setAttribute('aria-expanded', open);
    });
    // Close dropdown on outside click
    document.addEventListener('click', (e)=>{
      if(!projectsDropdown.contains(e.target)){
        projectsDropdown.classList.remove('open');
        projectsBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Mobile hamburger
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', ()=>{
      mobileMenu.classList.toggle('open');
    });

    // Mobile projects submenu
    const mobileProjectsBtn = document.querySelector('.mobile-projects-btn');
    const mobileSubmenu = document.querySelector('.mobile-submenu');
    mobileProjectsBtn.addEventListener('click', ()=>{
      const isOpen = mobileSubmenu.style.display === 'block';
      mobileSubmenu.style.display = isOpen ? 'none' : 'block';
      mobileProjectsBtn.setAttribute('aria-expanded', !isOpen);
    });

    // keyboard accessibility for dropdown (Esc closes)
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape'){
        projectsDropdown.classList.remove('open');
        projectsBtn.setAttribute('aria-expanded', 'false');
        mobileSubmenu.style.display = 'none';
        mobileProjectsBtn.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
